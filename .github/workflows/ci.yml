name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  clean-account:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      # The deny list lives in a repository secret (masked in logs), never in a
      # tracked file or a variable.
      # The lint and the public-vocabulary tests both read it.
      NO_PERSON_DENY: ${{ secrets.NO_PERSON_DENY }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      # The stand-alone ledger check clones the ledger repository from here; it
      # is an opaque input, and no account handle enters a tracked file.
      LEDGER_E2E_URL: https://github.com/${{ github.repository_owner }}/ledger.git
    steps:
      - uses: actions/checkout@v4
      # `claude plugin validate .` is not run here: the Claude Code CLI is not
      # part of the hosted runner image, and it runs in the release
      # verification step instead.
      # ci/lint-skills.sh and ci/check.sh both parse skill frontmatter with
      # PyYAML (ci/frontmatter.py) and fail if they cannot import it.
      - name: Install PyYAML
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install PyYAML==6.0.3
      - name: Verify standalone installation and lint
        shell: bash
        run: |
          set -euo pipefail
          unset HARNESS_ROOT
          ./ci/check.sh
      - name: Run skill tests
        shell: bash
        run: |
          set -euo pipefail
          unset HARNESS_ROOT
          export HOME
          HOME=$(mktemp -d)
          python3 -m pip install pytest==9.1.1
          shopt -s nullglob
          test_dirs=(skills/*/tests)
          if ((${#test_dirs[@]} == 0)); then
            printf 'ERROR: no test directories matched skills/*/tests\n' >&2
            exit 1
          fi
          for test_dir in "${test_dirs[@]}"; do
            python3 -m pytest "$test_dir" -q
          done
