name: CI

on:
  pull_request:
    types: [ready_for_review]
  push:
    branches: [main]

jobs:
  clean-account:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify standalone installation
        shell: bash
        run: |
          set -euo pipefail
          unset HARNESS_ROOT
          ./ci/check.sh
