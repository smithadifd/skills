name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

jobs:
  clean-account:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      # The deny list lives in a repository variable, never in a tracked file.
      # The lint and the public-vocabulary tests both read it.
      NO_PERSON_DENY: ${{ vars.NO_PERSON_DENY }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      # `claude plugin validate .` is not run here: the Claude Code CLI is not
      # part of the hosted runner image, and it runs in the release
      # verification step instead.
      - name: Verify standalone installation and lint
        shell: bash
        run: |
          set -euo pipefail
          unset HARNESS_ROOT
          ./ci/check.sh
      - name: Run skill tests
        shell: bash
        run: |
          set -euo pipefail
          unset HARNESS_ROOT
          export HOME
          HOME=$(mktemp -d)
          python3 -m pip install pytest==9.1.1
          shopt -s nullglob
          test_dirs=(skills/*/tests)
          if ((${#test_dirs[@]} == 0)); then
            printf 'ERROR: no test directories matched skills/*/tests\n' >&2
            exit 1
          fi
          for test_dir in "${test_dirs[@]}"; do
            python3 -m pytest "$test_dir" -q
          done
